# 依存の更新の PR を作る。minor と patch は種類ごとに 1 つの PR にまとめる。
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/backend", "/tools"]
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    # 開発用 (/) と本番用 (backend、frontend) の Dockerfile。
    directories: ["/", "/backend", "/frontend"]
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: ["/infra/bootstrap", "/infra/app", "/infra/modules/cloud_run_service"]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
