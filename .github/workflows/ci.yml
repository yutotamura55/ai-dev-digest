name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover が origin/main と比べるため、全部の履歴を取得する。
          fetch-depth: 0
          persist-credentials: false
      - name: Build the dev container
        run: |
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose build dev
      - name: Run scripts/check.sh in the dev container
        run: |
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm dev scripts/check.sh
